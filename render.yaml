services:
  - type: web
    name: coude-mable
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt psycopg2-binary gunicorn
    startCommand: gunicorn main:app -k gthread --threads 8 -b 0.0.0.0:$PORT --timeout 180
    envVars:
      - {key: PYTHON_VERSION, value: 3.12.3}
      - {key: SECRET_KEY, generateValue: true}
      - {key: SITE_URL, sync: false}
      - {key: ADMIN_EMAIL, sync: false}
      - {key: PLATEGA_MERCHANT_ID, sync: false}
      - {key: PLATEGA_SECRET, sync: false}
      - {key: DATABASE_URL, fromDatabase: {name: mable-db, property: connectionString}}
databases:
  - {name: mable-db, plan: free}
